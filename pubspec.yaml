    sdk: flutter
  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
