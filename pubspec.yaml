name: mega_sena_app
description: Aplicativo de análise e geração de jogos da Mega-Sena com estatísticas dos últimos 100 concursos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.2
  http: ^1.2.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#120B2F"
  adaptive_icon_foreground: "assets/icon/icon.png"
  ios_icon_size: 1024

flutter_native_splash:
  color: "#120B2F"
  image: "assets/splash/splash.png"
  android: true
  ios: true
  web: false
